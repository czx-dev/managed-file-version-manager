name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test
        run: mvn -B clean verify

      - name: Package
        run: mvn -B package -DskipTests

      - name: Upload HPI
        uses: actions/upload-artifact@v4
        with:
          name: jenkins-plugin
          path: target/*.hpi
